<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Gouri">
    <meta name="author" content="Gouri">

    <title>Gouri | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Portfolio</h1>

        <!-- Navigation -->
        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="cv.html">CV</a>
            <a href="education.html">Education</a>
            <a href="projects.html">Projects</a>
            <a href="activities.html">Activities</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <section>

            <h2>Contact Me</h2>

            <form id="contactForm">

                <!-- Name -->
                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

                <span id="nameError"></span>

                <br><br>


                <!-- Email -->
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >

                <span id="emailError"></span>

                <br><br>


                <!-- Preferred Contact Method -->
                <p>Preferred Contact Method:</p>

                <input
                    type="radio"
                    id="contactEmail"
                    name="contact"
                    value="email"
                >

                <label for="contactEmail">Email</label>

                <br>

                <input
                    type="radio"
                    id="contactPhone"
                    name="contact"
                    value="phone"
                >

                <label for="contactPhone">Phone</label>

                <br><br>


                <!-- Updates -->
                <input
                    type="checkbox"
                    id="updates"
                    name="updates"
                >

                <label for="updates">
                    I would like to receive updates.
                </label>

                <br><br>


                <!-- Message -->
                <label for="message">Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Enter your message"
                ></textarea>

                <span id="messageError"></span>

                <br><br>


                <!-- Submit Button -->
                <button type="submit">
                    Send Message
                </button>

                <span id="successMessage"></span>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Gouri | Personal Portfolio</p>
    </footer>


    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
