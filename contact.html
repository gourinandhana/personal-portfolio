    <main>

        <section>

            <h2>Contact Me</h2>

            <p>
                If you would like to get in touch with me, you can
                use the form below.
            </p>


            <!-- Contact Form -->

            <form>

                <label for="name">Name:</label>
                <br>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>

                <br><br>


                <label for="email">Email:</label>
                <br>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <br><br>


                <label>Preferred Contact Method:</label>
                <br>

                <input type="radio"
                       id="email-contact"
                       name="contact"
                       value="email">

                <label for="email-contact">Email</label>

                <input type="radio"
                       id="phone-contact"
                       name="contact"
                       value="phone">

                <label for="phone-contact">Phone</label>

                <br><br>


                <input type="checkbox"
                       id="updates"
                       name="updates">

                <label for="updates">
                    I would like to receive updates.
                </label>

                <br><br>


                <label for="message">Message:</label>
                <br>

                <textarea id="message"
                          name="message"
                          rows="5"
                          cols="30"
                          placeholder="Enter your message">
                </textarea>

                <br><br>


                <button type="submit">Send Message</button>

            </form>


            <!-- Embedded Content -->

            <h3>My Location</h3>

            <iframe
                src="https://www.google.com/maps?q=Kerala,India&output=embed"
                width="400"
                height="250"
                title="Map showing Kerala, India">
            </iframe>

        </section>

    </main>
