            <h2>Contact Me</h2>

            <p>
                If you would like to get in touch with me, you can
                use the form below.
            </p>


            <!-- Contact Form -->

           <form id="contactForm">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email">

    <label>Preferred Contact Method:</label>

    <input type="radio" id="contactEmail" name="contact" value="email">
    <label for="contactEmail">Email</label>

    <input type="radio" id="contactPhone" name="contact" value="phone">
    <label for="contactPhone">Phone</label>

    <br>

    <input type="checkbox" id="updates" name="updates">
    <label for="updates">I would like to receive updates.</label>

    <br><br>

    <label for="message">Message:</label>
    <textarea id="message" name="message" placeholder="Enter your message"></textarea>

    <button type="submit">Send Message</button>

</form>

            <!-- Embedded Content -->

            <h3>My Location</h3>

                src="https://www.google.com/maps?q=Kerala,India&output=embed"
                width="400"
                height="250"
                title="Map showing Kerala, India">
